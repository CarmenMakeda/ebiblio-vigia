name: Vigía eBiblio

on:
  schedule:
    # Cada hora de 7:23 a 23:23 (hora de Madrid en verano; en invierno, de 6:23 a 22:23).
    # GitHub usa hora UTC y a veces retrasa unos minutos las ejecuciones programadas.
    - cron: "23 5-21 * * *"
  workflow_dispatch:
    inputs:
      accion:
        description: "Qué hacer"
        type: choice
        default: comprobar
        options:
          - comprobar
          - probar
          - comprobar-completa

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar
        run: pip install -r requirements.txt

      - name: Comprobar eBiblio
        id: vigia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_USUARIO: ${{ secrets.EMAIL_USUARIO }}
          EMAIL_CONTRASENA: ${{ secrets.EMAIL_CONTRASENA }}
          EMAIL_PARA: ${{ secrets.EMAIL_PARA }}
          VIGIA_URL_WEB: ${{ vars.PUBLICAR_WEB == 'true' && format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) || '' }}
        run: |
          set +e
          ACCION="${{ inputs.accion || 'comprobar' }}"
          if [ "$ACCION" = "probar" ]; then
            python -m vigia probar
          elif [ "$ACCION" = "comprobar-completa" ]; then
            python -m vigia comprobar --completa
          else
            python -m vigia comprobar
          fi
          echo "codigo=$?" >> "$GITHUB_OUTPUT"

      - name: Guardar memoria del vigía
        run: |
          git config user.name "vigia-ebiblio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data/; fi
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -q -m "Comprobación $(date -u +'%Y-%m-%d %H:%M') UTC"
          for intento in 1 2 3; do
            git pull -q --rebase && git push -q && exit 0
            sleep 5
          done
          echo "No he podido guardar la memoria" && exit 1

      - name: Preparar web
        if: vars.PUBLICAR_WEB == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Resultado
        if: steps.vigia.outputs.codigo != '0'
        run: |
          echo "::error::El vigía terminó con código ${{ steps.vigia.outputs.codigo }}. Revisa el registro del paso «Comprobar eBiblio»."
          exit 1

  web:
    needs: vigia
    if: always() && vars.PUBLICAR_WEB == 'true' && needs.vigia.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - name: Publicar web
        id: publicar
        uses: actions/deploy-pages@v4
